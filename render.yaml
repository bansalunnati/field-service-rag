services:
  - type: web
    name: field-service-rag-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: sudo apt-get install -y tesseract-ocr poppler-utils && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # ── Python version — forces 3.11; runtime.txt is unreliable on Render ────
      - key: PYTHON_VERSION
        value: "3.11.9"
      # ── Azure OpenAI ──────────────────────────────────────────────────────────
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        sync: false
      - key: AZURE_OPENAI_CHAT_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
        sync: false
      # ── Auth ──────────────────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true          # Render generates a secure random value
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # ── CORS — set to your Vercel URL after first deploy ─────────────────────
      - key: ALLOWED_ORIGINS
        sync: false
      # ── Database — attach a Render PostgreSQL instance ───────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: field-service-rag-db
          property: connectionString
      # ── File storage dirs (relative to rootDir) ───────────────────────────────
      - key: UPLOADS_DIR
        value: data/uploaded_files
      - key: REPORTS_DIR
        value: data/submitted_reports

databases:
  - name: field-service-rag-db
    databaseName: field_service_rag
    plan: free
    region: oregon
