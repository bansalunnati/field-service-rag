services:
  - type: web
    name: field-service-rag-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # Persistent disk for uploaded/submitted files (UPLOADS_DIR, REPORTS_DIR
    # below both live under data/, which this mounts) — survives restarts,
    # redeploys, and instance changes. Render Disks require a paid plan,
    # hence "starter" above instead of "free".
    disk:
      name: field-service-rag-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # ── Azure OpenAI ──────────────────────────────────────────────────────────
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        sync: false
      - key: AZURE_OPENAI_CHAT_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
        sync: false
      # ── Auth ──────────────────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # ── CORS — set to your Vercel URL after first deploy ─────────────────────
      - key: ALLOWED_ORIGINS
        sync: false
      # ── Database — attach a Render PostgreSQL instance ───────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: field-service-rag-db
          property: connectionString
      # ── File storage dirs (relative to workdir /app) ─────────────────────────
      - key: UPLOADS_DIR
        value: data/uploaded_files
      - key: REPORTS_DIR
        value: data/submitted_reports
      # ── Vector store — pgvector in the same Postgres DB above, NOT local   ──
      # ── disk, so embeddings survive container restarts/redeploys/scaling.   ──
      - key: VECTOR_STORE
        value: pgvector

databases:
  - name: field-service-rag-db
    databaseName: field_service_rag
    plan: free
    region: oregon
