services:
  - type: web
    name: field-service-rag-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # ── Azure OpenAI ──────────────────────────────────────────────────────────
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        sync: false
      - key: AZURE_OPENAI_CHAT_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
        sync: false
      # ── Auth ──────────────────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # ── CORS — set to your Vercel URL after first deploy ─────────────────────
      - key: ALLOWED_ORIGINS
        sync: false
      # ── Database — attach a Render PostgreSQL instance ───────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: field-service-rag-db
          property: connectionString
      # ── File storage dirs — only used as a LOCAL FALLBACK when the object   ──
      # ── storage vars below aren't configured. With those set, uploaded     ──
      # ── files/reports go there instead and survive restarts/redeploys;     ──
      # ── without them, these paths live on the free plan's ephemeral disk   ──
      # ── and get wiped on restart.                                          ──
      - key: UPLOADS_DIR
        value: data/uploaded_files
      - key: REPORTS_DIR
        value: data/submitted_reports
      # ── Object storage — durable storage for uploaded documents and        ──
      # ── submitted reports. Works with any S3-compatible provider          ──
      # ── (Supabase Storage, Cloudflare R2, AWS S3, etc) — only the         ──
      # ── endpoint/region differ. For Supabase: Project Settings > Storage  ──
      # ── > S3 Connection gives you the endpoint URL and region; generate   ──
      # ── an access key from the same page. Fill these in via the Render    ──
      # ── dashboard (sync: false means "set manually, not in this file").   ──
      # ── All four required ones must be set together — if any is missing, ──
      # ── the app falls back to the ephemeral local disk above.             ──
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_BUCKET_NAME
        sync: false
      - key: STORAGE_REGION
        sync: false
      # ── Vector store — pgvector in the same Postgres DB above, NOT local   ──
      # ── disk, so embeddings survive container restarts/redeploys/scaling.   ──
      - key: VECTOR_STORE
        value: pgvector

databases:
  - name: field-service-rag-db
    databaseName: field_service_rag
    plan: free
    region: oregon
